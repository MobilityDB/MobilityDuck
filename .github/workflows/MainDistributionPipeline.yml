#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
# Multi-version matrix:
#   - duckdb-build-v1-4 / duckdb-deploy-v1-4 — LTS line (v1.4.4); the
#     ecosystem alignment target.  Required.
#   - duckdb-build-v1-5 — opt-in 1.5.x track.  Surfaces the actual
#     DuckDB API divergences so the source-side preprocessor conditionals
#     (step 3) and per-version expected files (step 4) can be authored
#     against real failure signals.  Allowed to be red while step 3+4
#     are pending.
#
# Each row calls a different extension-ci-tools workflow tag because the
# `uses:` value in GitHub Actions cannot be a matrix expression.  See
# doc/multi-duckdb-version.md for the per-version manifest.
name: Main Extension Distribution Pipeline
on:
  pull_request:
    # `main` for release-bound PRs, plus `feat/**`, `fix/**`, `ci/**`,
    # `cleanup/**`, `chore/**` so stacked PRs (each targeting the previous
    # branch rather than `main`) trigger CI automatically — instead of
    # needing a manual `workflow_dispatch` call from a reviewer or from a
    # maintainer's local machine.
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'cleanup/**'
      - 'chore/**'
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true


jobs:
  # --------------------------------------------------------------------
  # DuckDB v1.4.4 (LTS) — required
  # --------------------------------------------------------------------
  duckdb-build-v1-4:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.4
    with:
      duckdb_version: v1.4.4
      extension_name: mobilityduck
      ci_tools_version: v1.4.4
      vcpkg_commit: c27eeddba73f608f10605d80bc0144c1166f8fb7
      artifact_postfix: -v1-4
      # Windows is excluded because the MEOS vcpkg port does not currently
      # build under MSVC or MinGW: it pulls in PostgreSQL-derived sources
      # that depend on POSIX-only headers (e.g. <dirent.h>) and GCC-only
      # attribute syntax (`__attribute__((unused))`). Re-enable once the
      # MEOS port grows Windows support.
      exclude_archs: windows_amd64;windows_amd64_mingw;linux_amd64_musl

  duckdb-deploy-v1-4:
    needs: duckdb-build-v1-4
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.4.4
    secrets: inherit
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.4
      extension_name: mobilityduck
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      artifact_postfix: -v1-4
      exclude_archs: windows_amd64;windows_amd64_mingw;linux_amd64_musl

  # --------------------------------------------------------------------
  # DuckDB v1.5.2 (latest 1.5.x line) — opt-in track
  #
  # The reusable workflow's `make set_duckdb_version` step checks out the
  # DuckDB tag inside the `duckdb/` submodule directory.  The `duckdb-spatial`
  # and `extension-ci-tools` references are taken from the parent repository's
  # submodule SHAs, which on `main` target the v1.4 line — `set-duckdb-version`
  # (added by the foundation PR) must therefore be run before this job's
  # checkout to align those two submodules.  As of step 2 there is no hook
  # inside the reusable workflow to interleave that swap; this job will fail
  # until step 3 (preprocessor conditionals) and the parent-side swap mechanism
  # land.  Kept here to surface the actual API divergences and to make the
  # matrix shape visible.
  duckdb-build-v1-5:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      extension_name: mobilityduck
      ci_tools_version: v1.5-variegata
      vcpkg_commit: c27eeddba73f608f10605d80bc0144c1166f8fb7
      artifact_postfix: -v1-5
      exclude_archs: windows_amd64;windows_amd64_mingw;linux_amd64_musl

  # Deploy for v1.5 is held until duckdb-build-v1-5 is reliably green —
  # i.e. after step 3 (source preprocessor conditionals) and step 4
  # (per-version expected-output variants) land.  Adding the deploy job
  # too early would push broken binaries to the community-extension
  # repository.
