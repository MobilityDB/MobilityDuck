# refresh.conf — MobilityDuck's last leg for tools/refresh-binding.sh (in MEOS-API).
# MobilityDuck tracks MobilityDB master: the vcpkg MEOS portfile resolves master's tip at build
# time, so the catalog is derived from master (MDB_REF=master, no pin). The generator
# tools/codegen_duck_udfs.py is pure Python over the catalog JSON, so no libmeos is built here
# (BUILD_LIBMEOS=false); the extension build links its own libmeos through vcpkg. The catalog is
# staged to tools/catalog/meos-idl.json (gitignored, derived), matching the meos-surface-refresh.yml
# CI workflow. BUILD_CMD regenerates the committed surface then builds and tests the extension.
ENGINE=duck
BUILD_DIR=.
BUILD_LIBMEOS=false
MDB_REF=master
FAMILIES=-DALL=ON
CATALOG_DEST=tools/catalog/meos-idl.json
BUILD_CMD='python3 tools/codegen_duck_udfs.py tools/catalog/meos-idl.json src/generated/generated_temporal_udfs.cpp
  make
  [ -n "${SKIP_TESTS:-}" ] || make test'
