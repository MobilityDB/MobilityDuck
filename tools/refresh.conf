# refresh.conf — MobilityDuck's last leg for tools/refresh-binding.sh (in MEOS-API).
# MobilityDuck tracks MobilityDB master one RECORDED commit at a time: vcpkg_ports/meos/
# portfile.cmake holds that commit in `_MEOS_REF`, libmeos is built from it, and the committed
# generated surface is derived from the SAME commit, so the library and the surface a build links
# together always come from one upstream commit. A local refresh therefore derives at that
# recorded commit, which is what this tree links against — deriving at master's tip instead would
# produce a surface for a libmeos this checkout does not have, the mismatch
# meos-surface-refresh.yml guards against when it rewrites `_MEOS_REF` to the catalog's own
# sourceCommit rather than re-reading the tip.
#
# It also makes a local refresh REPRODUCIBLE: the reference point moves when the daily workflow
# advances the pin, not on every upstream push, so a derived catalog stays valid across a session
# and can be shared between sessions instead of being re-derived against a moving target.
#
# To drift-check against the tip instead (what the daily workflow does, on its way to advancing
# the pin): tools/refresh-from-master.sh --mdb-ref master
#
# The generator tools/codegen_duck_udfs.py is pure Python over the catalog JSON, so no libmeos is
# built here (BUILD_LIBMEOS=false); the extension build links its own libmeos through vcpkg. The
# catalog is staged to tools/catalog/meos-idl.json (gitignored, derived). BUILD_CMD regenerates the
# committed surface then builds and tests the extension.
ENGINE=duck
BUILD_DIR=.
BUILD_LIBMEOS=false
MDB_REF=$(sed -n 's/^set(_MEOS_REF "\([0-9a-f]\{7,40\}\)").*$/\1/p' "$BINDING/vcpkg_ports/meos/portfile.cmake")
FAMILIES=-DALL=ON
CATALOG_DEST=tools/catalog/meos-idl.json
BUILD_CMD='python3 tools/codegen_duck_udfs.py tools/catalog/meos-idl.json src/generated/generated_temporal_udfs.cpp
  make
  [ -n "${SKIP_TESTS:-}" ] || make test'
